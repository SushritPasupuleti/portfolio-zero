apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-puffin-api
  namespace: portfolio-puffin
  labels:
    app.kubernetes.io/name: portfolio-puffin-api
    app.kubernetes.io/part-of: portfolio-puffin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-puffin-api
  template:
    metadata:
      labels:
        app: portfolio-puffin-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-user/portfolio-puffin-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: portfolio-puffin-config
            - secretRef:
                name: portfolio-puffin-secrets
          volumeMounts:
            - name: portfolio-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: portfolio-data
          persistentVolumeClaim:
            claimName: portfolio-puffin-data
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-puffin-api
  namespace: portfolio-puffin
spec:
  selector:
    app: portfolio-puffin-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
