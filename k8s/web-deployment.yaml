apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-puffin-web
  namespace: portfolio-puffin
  labels:
    app.kubernetes.io/name: portfolio-puffin-web
    app.kubernetes.io/part-of: portfolio-puffin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-puffin-web
  template:
    metadata:
      labels:
        app: portfolio-puffin-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-user/portfolio-puffin-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-puffin-web
  namespace: portfolio-puffin
spec:
  selector:
    app: portfolio-puffin-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
